[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "specter-slopsquat"
version = "1.0.0"
description = "T282 SPECTER SLOPSQUAT — Hallucinated Dependency Injection Engine"
authors = [{name = "Red Specter Security Research Ltd"}]
license = {text = "Apache License 2.0"}
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "cryptography>=41.0.0",
    "pydantic>=2.0.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "python-Levenshtein>=0.21.1",
    "confusable-homoglyphs>=3.2.4",
    "editdistance>=0.8.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.11.1",
    "black>=23.0.0",
    "ruff>=0.0.290",
]

[project.scripts]
specter-slopsquat = "specter_slopsquat.cli:main"

[tool.setuptools]
packages = ["specter_slopsquat"]
